[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/writzx/viewkai"
authors = ["Writwick"]

[workspace.dependencies]
egui = "0.34"
egui-phosphor = { version = "0.12", features = ["regular"] }
pdfium-render = { version = "0.9", features = ["thread_safe"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.34", default-features = false, features = ["wgpu", "x11", "wayland"] }
rfd = "0.15"
ehttp = "0.5"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Targeted allows (documented inline, each with justification)
module_name_repetitions = "allow"  # idiomatic in small domain modules (cache::CacheEntry)
missing_errors_doc = "allow"       # temporarily allowed; Phase B/C tightens per-function
cast_precision_loss = "allow"      # tests/bench display helpers and zoom math use bounded values
redundant_closure_for_method_calls = "allow" # test poison handling closures stay explicit and readable
semicolon_if_nothing_returned = "allow" # criterion benches prefer expression-style closures
uninlined_format_args = "allow"    # existing acceptance tests keep stable explicit formatting strings
multiple_crate_versions = "allow"  # transitive GUI/pdf stacks currently pull parallel upstream versions outside workspace control
redundant_feature_names = "allow"  # justify: viewkai-core's "test-support" feature is de-facto Cargo convention; renaming would break test fixtures
