[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/writzx/viewkai"
authors = ["Writwick"]

[workspace.dependencies]
egui = "0.34"
pdfium-render = { version = "0.9", features = ["thread_safe"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.34", default-features = false, features = ["wgpu", "x11", "wayland"] }
rfd = "0.15"
ehttp = "0.5"
