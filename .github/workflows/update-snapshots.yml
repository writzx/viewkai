name: Update Snapshots

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  update-snapshots:
    name: update-snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download pdfium (Linux x64)
        run: |
          curl -fsSL --retry 5 --retry-delay 10 "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7789/pdfium-linux-x64.tgz" -o /tmp/pdfium.tgz
          tar xzf /tmp/pdfium.tgz -C /tmp lib/
          echo "PDFIUM_DYLIB_PATH=/tmp/lib/libpdfium.so" >> $GITHUB_ENV
      - name: Install Vulkan/lavapipe for egui_kittest wgpu renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true
      - name: Regenerate snapshot baselines (Linux/lavapipe)
        run: |
          UPDATE_SNAPSHOTS=true cargo test -p viewkai snapshot_ -- --test-threads=1
          UPDATE_SNAPSHOTS=true cargo test -p viewkai --test selection_snapshot -- --test-threads=1
          UPDATE_SNAPSHOTS=true cargo test -p viewkai --test text_layer_debug -- --test-threads=1
          UPDATE_SNAPSHOTS=true cargo test -p viewkai --test text_layer_multipage -- --test-threads=1
          cargo test -p viewkai --test text_layer_multipage -- --test-threads=1
      - name: Verify baselines pass
        run: |
          cargo test -p viewkai snapshot_ -- --test-threads=1
          cargo test -p viewkai --test selection_snapshot -- --test-threads=1
          cargo test -p viewkai --test text_layer_debug -- --test-threads=1
          cargo test -p viewkai --test text_layer_multipage -- --test-threads=1
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/viewkai/tests/snapshots/*.png
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
          else
            BRANCH="chore/update-snapshots-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "chore(snapshots): regenerate baselines from Linux/lavapipe CI"
            git push origin "$BRANCH"
            echo "Pushed to branch: $BRANCH"
            echo "Merge this branch into main to update the snapshot baselines."
          fi
