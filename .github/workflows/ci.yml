name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - run: cargo deny --all-features check

  machete:
    name: machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - run: cargo machete

  hack:
    name: hack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        run: cargo install cargo-hack --locked
      - run: cargo hack check --workspace --feature-powerset --depth 2

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken-intra-doc-links -D rustdoc::private-intra-doc-links -W missing-docs"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Download pdfium binaries for Linux x64 (bblanchon, for native tests only)
      - name: Download pdfium (Linux x64)
        run: |
          curl -fsSL --retry 5 --retry-delay 10 "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7789/pdfium-linux-x64.tgz" -o /tmp/pdfium.tgz
          tar xzf /tmp/pdfium.tgz -C /tmp lib/
          echo "PDFIUM_DYLIB_PATH=/tmp/lib/libpdfium.so" >> $GITHUB_ENV
      - name: Install Vulkan/lavapipe for egui_kittest wgpu renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true
      - run: cargo test --workspace

  build-wasm:
    name: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin
      - name: Build WASM demo
        run: trunk build --release
        working-directory: crates/viewkai-web

  build-native:
    name: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download pdfium (Linux x64)
        run: |
          curl -fsSL --retry 5 --retry-delay 10 "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7789/pdfium-linux-x64.tgz" -o /tmp/pdfium.tgz
          tar xzf /tmp/pdfium.tgz -C /tmp lib/
          echo "PDFIUM_DYLIB_PATH=/tmp/lib/libpdfium.so" >> $GITHUB_ENV
      - name: Build native app
        run: cargo build -p viewkai-app --release

  purity-app:
    name: purity-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check viewkai-app has no WASM-only runtime deps
        run: |
          if cargo tree -p viewkai-app -e normal --prefix none 2>&1 | grep -qE '^(wasm-bindgen|js-sys|web-sys|wasm-bindgen-futures)( |$)'; then
            echo "FAIL: viewkai-app contains WASM-only dependencies"
            exit 1
          fi

  purity-web:
    name: purity-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check viewkai-web has no native-only runtime deps
        run: |
          if cargo tree -p viewkai-web -e normal --prefix none 2>&1 | grep -qE '^(rfd|env_logger)( |$)'; then
            echo "FAIL: viewkai-web contains native-only dependencies"
            exit 1
          fi

  purity-plugins:
    name: purity-plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert viewkai-plugins has no eframe runtime dep
        run: |
          if cargo tree -p viewkai-plugins -e normal --prefix none 2>&1 | grep -qE '^eframe( |$)'; then
            echo "FAIL: viewkai-plugins contains eframe"
            exit 1
          fi
      - name: Assert viewkai-plugins surfaces no pdfium_render
        run: |
          if grep -rn 'pdfium_render::' crates/viewkai-plugins/src --include='*.rs'; then
            echo "FAIL: pdfium_render::* surfaced in viewkai-plugins"
            exit 1
          fi

  purity-viewkai:
    name: purity-viewkai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check viewkai has no eframe/tokio/reqwest
        run: |
          if cargo tree -p viewkai -e normal 2>&1 | grep -qE "\b(eframe|tokio|reqwest)\b"; then
            echo "FAIL: eframe/tokio/reqwest found in viewkai dependency tree"
            cargo tree -p viewkai -e normal 2>&1 | grep -E "\b(eframe|tokio|reqwest)\b"
            exit 1
          fi

  purity-engine:
    name: purity-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check viewkai-engine has no egui/eframe
        run: |
          if cargo tree -p viewkai-engine -e normal 2>&1 | grep -qE "\b(egui|eframe)\b"; then
            echo "FAIL: egui/eframe found in viewkai-engine dependency tree"
            cargo tree -p viewkai-engine -e normal 2>&1 | grep -E "\b(egui|eframe)\b"
            exit 1
          fi

  purity-core:
    name: purity-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check viewkai-core has no pdfium-render/egui/eframe
        run: |
          if cargo tree -p viewkai-core -e normal 2>&1 | grep -qE "\b(pdfium-render|egui|eframe)\b"; then
            echo "FAIL: pdfium-render/egui/eframe found in viewkai-core dependency tree"
            cargo tree -p viewkai-core -e normal 2>&1 | grep -E "\b(pdfium-render|egui|eframe)\b"
            exit 1
          fi
