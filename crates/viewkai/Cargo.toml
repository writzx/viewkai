[package]
name = "viewkai"
version = "0.0.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust PDF viewer library targeting wasm32 and native, built on pdfium-render and egui"
readme = "../../README.md"
keywords = ["pdf", "egui", "viewer", "wasm", "gui"]
categories = ["gui", "rendering", "wasm"]

[dependencies]
viewkai-core = { path = "../viewkai-core" }
viewkai-engine = { path = "../viewkai-engine" }
egui = { workspace = true }

[dev-dependencies]
viewkai-engine = { path = "../viewkai-engine" }
criterion = { version = "0.5", features = ["html_reports"] }
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot", "eframe"] }

[[bench]]
name = "large_doc"
harness = false

[lints]
workspace = true
