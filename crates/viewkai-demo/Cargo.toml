[package]
name = "viewkai-demo"
version = "0.0.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Demo app for viewkai — native + WASM"

[[bin]]
name = "viewkai-demo"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true }
viewkai = { path = "../viewkai" }
viewkai-core = { path = "../viewkai-core" }
viewkai-engine = { path = "../viewkai-engine" }
rfd = { workspace = true }
ehttp = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = { version = "0.2", features = ["enable-interning"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "console"] }

[dev-dependencies]
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot", "eframe"] }
