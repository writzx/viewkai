[package]
name = "viewkai-web"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Web demo for viewkai — WASM target"
readme = "../../README.md"
keywords = ["pdf", "egui", "viewer", "demo", "wasm"]
categories = ["gui", "rendering", "wasm"]

[[bin]]
name = "viewkai-web"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true }
viewkai = { path = "../viewkai" }
viewkai-core = { path = "../viewkai-core" }
viewkai-engine = { path = "../viewkai-engine" }
ehttp = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = { version = "0.2", features = ["enable-interning"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "console"] }

[dev-dependencies]
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot"] }

[lints]
workspace = true
