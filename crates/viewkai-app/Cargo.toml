[package]
name = "viewkai-app"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native PDF viewer application built on viewkai"
readme = "../../README.md"
keywords = ["pdf", "egui", "viewer", "native"]
categories = ["gui", "rendering"]

[[bin]]
name = "viewkai-app"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true }
viewkai = { path = "../viewkai" }
viewkai-core = { path = "../viewkai-core" }
viewkai-engine = { path = "../viewkai-engine" }
rfd = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[dev-dependencies]
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot", "eframe"] }

[lints]
workspace = true
