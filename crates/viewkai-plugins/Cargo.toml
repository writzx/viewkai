[package]
name = "viewkai-plugins"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sealed plugin abstraction for viewkai — built-in plugins only"
readme = "../../README.md"
keywords = ["pdf", "egui", "viewer", "plugin"]
categories = ["gui", "rendering"]

[features]
default = []
test-support = []

[dependencies]
egui = { workspace = true }
egui-phosphor = { workspace = true }
viewkai-core = { path = "../viewkai-core" }
viewkai-engine = { path = "../viewkai-engine" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = "0.3"

[dev-dependencies]
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot"] }

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
redundant_closure_for_method_calls = "allow"
semicolon_if_nothing_returned = "allow"
uninlined_format_args = "allow"
multiple_crate_versions = "allow"
redundant_feature_names = "allow"  # justify: viewkai-core's "test-support" feature is de-facto Cargo convention; renaming would break test fixtures
