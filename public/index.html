<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>viewkai demo</title>
    <style>
      html, body { margin: 0; overflow: hidden; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <!-- 
      PDFium WASM init ceremony.
      pdfium-render requires initialize_pdfium_render(pdfiumModule, localModule, debug) to be called
      from JavaScript before any pdfium-render Rust code runs.
      
      Step 1: pdfium.js loads (factory-function pattern, exported as PDFiumModule).
      Step 2: PDFiumModule() promise stores the resolved module at window.__pdfiumModule.
      Step 3: trunk injects the eframe WASM bundle via the <link data-trunk rel="rust"> below.
      Step 4: The WASM startup code (wasm_start) awaits window.__pdfiumModule, then calls
              initialize_pdfium_render(window.__pdfiumModule, wasm_bindgen.__wbindgen_get_module(), false).
    -->
    <script src="pdfium.js"></script>
    <script>
      // Initialize PDFium WASM and make module available globally.
      window.__pdfiumModule = null;
      PDFiumModule().then((m) => {
        window.__pdfiumModule = m;
      });
    </script>
    <!-- trunk injects the compiled eframe WASM bundle here -->
    <link data-trunk rel="rust" />
    <canvas id="the_canvas_id"></canvas>
  </body>
</html>
