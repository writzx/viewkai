<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>viewkai web demo</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    
    
  <link rel="modulepreload" href="./viewkai-web-ce043abf80922ddc.js" crossorigin="anonymous" integrity="sha384-GsypAYO9Irv8ulbD/07pHnVHVbAwbEU9lMnbo63WlkDqmkpPM5I9uH7EVlsAExqj"><link rel="preload" href="./viewkai-web-ce043abf80922ddc_bg.wasm" crossorigin="anonymous" integrity="sha384-a9v8RqxAmWtFkUN0aVifwSGmlw1TdKavO5B+mpMul9x7u3sTcZz9Ip9x8cuxUttN" as="fetch" type="application/wasm"></head>
  <body>
    <!-- Keep this in sync with public/index.html for local web hosting. -->
    <input type="file" id="viewkai-file-input" accept="application/pdf,.pdf" style="display:none" />
    <script src="pdfium.js"></script>
    <script>
      // Load pdfium's emscripten module as a promise; the Rust wasm module
      // is loaded separately by Trunk and dispatches `TrunkApplicationStarted`
      // when ready. We initialize pdfium-render's bindings once both are ready,
      // then hand control to Rust via the exported `run()` function.
      const pdfiumReady = PDFiumModule();
      window.addEventListener("TrunkApplicationStarted", async (event) => {
        try {
          const pdfiumModule = await pdfiumReady;
          window.__pdfiumModule = pdfiumModule;
          const bindings = window.wasmBindings;
          const rustModule = event.detail.wasm;
          if (!bindings.initialize_pdfium_render(pdfiumModule, rustModule, false)) {
            console.error("initialize_pdfium_render returned false");
            return;
          }
          bindings.run();
        } catch (err) {
          console.error("pdfium/viewkai bootstrap failed:", err);
        }
      });
    </script>
    
<script type="module">
import init, * as bindings from './viewkai-web-ce043abf80922ddc.js';
const wasm = await init({ module_or_path: './viewkai-web-ce043abf80922ddc_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <canvas id="the_canvas_id"></canvas>
  </body>
</html>
